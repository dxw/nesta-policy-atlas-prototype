etty\">{{ t.title }}<\u002Fh3>\n              <p style=\"margin:8px 0 0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ t.why }}<\u002Fp>\n              <div style=\"margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n                <span style=\"border:1px solid #a9dbc8;background:#e8f6ef;padding:5px 10px;font-size:16px;font-weight:700;line-height:20px;color:#00694a\">{{ t.strength }}<\u002Fspan>\n                <span style=\"font-size:16px;line-height:20px;color:#646363\">{{ t.meta }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n\n      <sc-for list=\"{{ sections }}\" as=\"s\" hint-placeholder-count=\"11\">\n        <section style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:26px\">\n          <h2 id=\"{{ s.id }}\" style=\"margin:0;max-width:30em;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A;text-wrap:pretty\">{{ s.title }}<\u002Fh2>\n          <p style=\"margin:8px 0 0;max-width:56em;font-size:19px;line-height:25px;color:#576980;text-wrap:pretty\">{{ s.summary }}<\u002Fp>\n          <sc-if value=\"{{ s.hasDetail }}\" hint-placeholder-val=\"{{ true }}\"><div style=\"margin-top:10px;font-size:16px\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ s.toggle }}\" style=\"cursor:pointer;font-weight:800;color:#0000FF;white-space:nowrap\" style-hover=\"color:#0000d6\">{{ s.label }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n          <sc-if value=\"{{ s.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <ul style=\"margin:16px 0 0;border-left:2px solid #c7c7ff;padding:2px 0 2px 20px;display:flex;flex-direction:column;gap:10px;list-style:none;font-size:19px;line-height:25px;color:#1c1c1e\">\n              <sc-for list=\"{{ s.detail }}\" as=\"d\" hint-placeholder-count=\"2\">\n                <li>{{ d.text }} <sc-if value=\"{{ d.hasCite }}\" hint-placeholder-val=\"{{ true }}\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ d.open }}\" title=\"{{ d.tip }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 3px;border:1px solid #c7c7ff;background:#ececff;padding:0 7px;font-size:16px;font-weight:700;color:#0000FF;vertical-align:1px\">{{ d.chip }}<\u002Fspan><\u002Fsc-if><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fsc-for>\n\n      <section style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:26px\">\n        <h2 id=\"references\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">References<\u002Fh2>\n        <p style=\"margin:8px 0 0;font-size:19px;line-height:25px;color:#576980\">{{ countRefsLine }}<\u002Fp>\n        <div style=\"margin-top:10px;font-size:16px\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleRefs }}\" style=\"cursor:pointer;font-weight:800;color:#0000FF;white-space:nowrap\" style-hover=\"color:#0000d6\">{{ refsLabel }}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ refsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <ol style=\"margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ references }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <li style=\"display:flex;gap:12px;font-size:19px;line-height:25px\">\n                <span style=\"flex-shrink:0;font-weight:700;color:#0F294A\">{{ r.tag }}<\u002Fspan>\n                <span><span style=\"color:#0F294A\">{{ r.authors }} <\u002Fspan><span sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;font-weight:600;color:#0F294A\" style-hover=\"color:#0000FF;text-decoration:underline\">{{ r.title }}<\u002Fspan><span style=\"font-style:italic;color:#646363\">{{ r.meta }}<\u002Fspan><\u002Fspan>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:26px\">\n        <h2 id=\"how-gathered\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">How the evidence was gathered<\u002Fh2>\n        <p style=\"margin:8px 0 0;font-size:19px;line-height:25px;color:#576980\">{{ countFunnelLine }}<\u002Fp>\n        <div style=\"margin-top:10px;font-size:16px\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleHow }}\" style=\"cursor:pointer;font-weight:800;color:#0000FF;white-space:nowrap\" style-hover=\"color:#0000d6\">{{ howLabel }}<\u002Fspan><\u002Fdiv>\n        <sc-if value=\"{{ howOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:16px;display:grid;grid-template-columns:{{ statCols }};border:1px solid #e4e4e7\">\n            <div style=\"border-right:1px solid #e4e4e7;padding:14px 16px\">\n              <div style=\"font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">{{ countFound }}<\u002Fdiv>\n              <div style=\"margin-top:2px;font-size:16px;color:#646363\">documents found<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-right:1px solid #e4e4e7;padding:14px 16px\">\n              <div style=\"font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">{{ countIncluded }}<\u002Fdiv>\n              <div style=\"margin-top:2px;font-size:16px;color:#646363\">included after screening<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-right:1px solid #e4e4e7;padding:14px 16px\">\n              <div style=\"font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">{{ countScreened }}<\u002Fdiv>\n              <div style=\"margin-top:2px;font-size:16px;color:#646363\">screened out<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 16px\">\n              <div style=\"font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">{{ countCited }}<\u002Fdiv>\n              <div style=\"margin-top:2px;font-size:16px;color:#646363\">cited in this report<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= FULL BRIEFING ================= -->\n  <sc-if value=\"{{ isBriefing }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;margin:0 auto;max-width:1060px;padding:32px 24px {{ mainPadBottom }};display:grid;grid-template-columns:{{ briefCols }};gap:36px;align-items:start\">\n\n    <sc-if value=\"{{ isWide }}\" hint-placeholder-val=\"{{ true }}\">\n    <aside style=\"position:sticky;top:82px;display:flex;flex-direction:column;gap:20px\">\n      <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ goSummary }}\" style=\"cursor:pointer;font-size:16px;font-weight:700;color:#0000FF\">← Back to summary<\u002Fdiv>\n      <div>\n        <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Contents<\u002Fdiv>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column;gap:2px;font-size:19px;font-weight:600\">\n          <a href=\"#b-exec\" style=\"border-left:2px solid #0000FF;padding:7px 0 7px 10px;color:#0F294A\">Executive summary<\u002Fa>\n          <a href=\"#b-themes\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 10px;color:#576980\">Themes<\u002Fa>\n          <a href=\"#b-fiscal\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 22px;font-weight:500;font-size:16px;color:#646363\">Fiscal and food environment<\u002Fa>\n          <a href=\"#b-school\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 22px;font-weight:500;font-size:16px;color:#646363\">School-based programmes<\u002Fa>\n          <a href=\"#b-family\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 22px;font-weight:500;font-size:16px;color:#646363\">Family, community, early years<\u002Fa>\n          <a href=\"#b-intl\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 10px;color:#576980\">International comparisons<\u002Fa>\n          <a href=\"#b-concl\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 10px;color:#576980\">Conclusions<\u002Fa>\n          <a href=\"#b-refs\" style=\"border-left:2px solid #e4e4e7;padding:7px 0 7px 10px;color:#576980\">References<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n    <\u002Fsc-if>\n\n    <div style=\"background:#fff;outline:1px solid #e4e4e7;outline-offset:-1px;padding:{{ cardPad }}\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\">\n        <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Full briefing<\u002Fdiv>\n        <div style=\"position:relative\">\n          <div role=\"button\" tabindex=\"0\" aria-haspopup=\"menu\" sc-camel-on-click=\"{{ toggleDl }}\" style=\"display:inline-flex;cursor:pointer;align-items:center;gap:8px;border:1px solid #e4e4e7;background:#fff;padding:7px 12px;font-size:16px;font-weight:700;line-height:20px;color:#0F294A\" style-hover=\"border-color:#c7c7ff;background:#f5f5ff\">Download <span style=\"font-size:16px;color:#646363\">▼<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ dlOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:170px;border:1px solid #e4e4e7;background:#fff;box-shadow:0 6px 18px rgba(15,41,74,.12)\">\n              <div role=\"menuitem\" tabindex=\"0\" sc-camel-on-click=\"{{ closeDl }}\" style=\"cursor:pointer;padding:9px 14px;font-size:19px;font-weight:600;color:#0F294A\" style-hover=\"background:#f5f5ff;color:#0000FF\">PDF<\u002Fdiv>\n              <div role=\"menuitem\" tabindex=\"0\" sc-camel-on-click=\"{{ closeDl }}\" style=\"cursor:pointer;border-top:1px solid #e4e4e7;padding:9px 14px;font-size:19px;font-weight:600;color:#0F294A\" style-hover=\"background:#f5f5ff;color:#0000FF\">Markdown<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <h1 style=\"margin:6px 0 0;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A\">{{ resultsTitle }}<\u002Fh1>\n\n      <div style=\"margin-top:20px;display:grid;grid-template-columns:{{ briefStatCols }};border:1px solid #e4e4e7\">\n        <div style=\"border-right:1px solid #e4e4e7;padding:12px 14px\">\n          <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Sources<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:16px;line-height:20px;color:#0F294A\">{{ countFound }} found · {{ countCited }} cited<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-right:1px solid #e4e4e7;padding:12px 14px\">\n          <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Study types<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:16px;line-height:20px;color:#0F294A\">23 policy guidance · 20 expert opinion · 14 trials<sc-if value=\"{{ stOpen }}\" hint-placeholder-val=\"{{ false }}\"><span> · 8 systematic reviews · 2 modelling studies<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleSt }}\" style=\"margin-top:6px;cursor:pointer;font-size:16px;font-weight:700;color:#0000FF\">{{ stLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-right:1px solid #e4e4e7;padding:12px 14px\">\n          <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Countries covered<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:16px;line-height:20px;color:#0F294A\">United Kingdom · Mexico · Chile · Netherlands<sc-if value=\"{{ ctOpen }}\" hint-placeholder-val=\"{{ false }}\"><span> · Australia · Portugal · Canada<\u002Fspan><\u002Fsc-if><\u002Fdiv>\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleCt }}\" style=\"margin-top:6px;cursor:pointer;font-size:16px;font-weight:700;color:#0000FF\">{{ ctLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 14px\">\n          <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Years<\u002Fdiv>\n          <div style=\"margin-top:4px;font-size:16px;line-height:20px;color:#0F294A\">2015–2025<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <section style=\"margin-top:32px\">\n        <h2 id=\"b-exec\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">Executive summary<\u002Fh2>\n        <p style=\"margin:12px 0 0;border-left:4px solid #0000FF;background:#f5f5ff;padding:16px 20px;font-size:19px;line-height:25px;color:#0F294A;text-wrap:pretty\">Measures that change the <b style=\"font-weight:800\">food environment<\u002Fb> — above all the Soft Drinks Industry Levy — carry the strongest UK evidence. School-only programmes shift behaviour but have not shifted weight. Confidence is <b style=\"font-weight:800\">moderate<\u002Fb>: several strong studies agree on what households buy, but only one UK study has measured an effect on children's weight.<\u002Fp>\n        <ul style=\"margin:16px 0 0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:25px;color:#1c1c1e\">\n          <sc-for list=\"{{ findings }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <li><b style=\"font-weight:700;color:#0F294A\">{{ f.lead }}<\u002Fb> {{ f.body }} <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ f.open }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">{{ f.cite }}<\u002Fspan><\u002Fli>\n          <\u002Fsc-for>\n          <li><b style=\"font-weight:700;color:#8a5a00\">Main evidence gap.<\u002Fb> No study yet links promotion-placement restrictions to weight outcomes — purchasing data only.<\u002Fli>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <h2 id=\"b-themes\" style=\"margin:38px 0 0;border-top:1px solid #e4e4e7;padding-top:26px;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">Themes<\u002Fh2>\n\n      <section style=\"margin-top:22px;border:1px solid #e4e4e7;padding:20px 22px\">\n        <h3 id=\"b-fiscal\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">1 · Fiscal and food-environment measures<\u002Fh3>\n        <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">The strongest and most consistent UK evidence concerns fiscal measures, and specifically the <b style=\"font-weight:700\">Soft Drinks Industry Levy<\u002Fb>.<\u002Fp>\n        <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ t1 }}\" style=\"margin-top:12px;display:inline-flex;cursor:pointer;align-items:center;gap:6px;font-size:16px;font-weight:700;color:#0000FF\">{{ l1 }}<\u002Fdiv>\n        <sc-if value=\"{{ o1 }}\" hint-placeholder-val=\"{{ false }}\">\n        <ul style=\"margin:16px -22px -20px;border-top:1px solid #e4e4e7;background:#fafafa;padding:18px 22px 18px 42px;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:25px;color:#1c1c1e\">\n          <li><span>The levy is associated with a <b style=\"font-weight:700\">substantial fall<\u002Fb> in the sugar content of soft drinks purchased by households, driven largely by reformulation rather than reduced purchasing.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openMulti }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[1,2]<\u002Fspan><\u002Fspan><\u002Fli>\n          <li>Evidence linking the levy directly to weight outcomes is thinner but emerging: <span>one quasi-experimental analysis reports <b style=\"font-weight:700\">lower obesity prevalence among year-6 girls<\u002Fb>, concentrated in the most deprived areas, with no equivalent effect detected in boys.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[3]<\u002Fspan><\u002Fspan><\u002Fli>\n          <li>Evaluations of in-store promotion restrictions are more recent and show <b style=\"font-weight:700\">early reductions in sugar purchased<\u002Fb>, though displacement to untargeted products remains under-studied.<\u002Fli>\n          <li><span>No study yet links promotion-placement restrictions to weight outcomes; purchasing data only.<span style=\"display:inline-flex;align-items:center;margin:0 4px;border:1px solid #f3d99a;background:#fff6e3;padding:0 6px;font-size:16px;font-weight:600;color:#8a5a00;vertical-align:2px\">gap<\u002Fspan><\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"margin-top:14px;border:1px solid #e4e4e7;padding:20px 22px\">\n        <h3 id=\"b-school\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">2 · School-based programmes<\u002Fh3>\n        <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">School-based evidence is mixed, and the contrast between outcome types matters more than the contrast between programmes.<\u002Fp>\n        <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ t2 }}\" style=\"margin-top:12px;display:inline-flex;cursor:pointer;align-items:center;gap:6px;font-size:16px;font-weight:700;color:#0000FF\">{{ l2 }}<\u002Fdiv>\n        <sc-if value=\"{{ o2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <ul style=\"margin:16px -22px -20px;border-top:1px solid #e4e4e7;background:#fafafa;padding:18px 22px 18px 42px;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:25px;color:#1c1c1e\">\n          <li>Programmes combining curriculum change with family engagement report improvements in dietary intake and physical activity.<\u002Fli>\n          <li><span>The two largest UK cluster-randomised trials found <b style=\"font-weight:700\">no significant effect on BMI<\u002Fb> at 24 months.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openMulti }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[4,5]<\u002Fspan><\u002Fspan><\u002Fli>\n          <li><span>Review-level evidence supports behavioural benefits while weight effects are <b style=\"font-weight:700\">small and often fade<\u002Fb>.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[6]<\u002Fspan><\u002Fspan><\u002Fli>\n          <li>Reviewers consistently read this as school-only interventions being too weak a dose against an obesogenic wider environment — consistent with the stronger fiscal results above.<span style=\"display:inline-flex;align-items:center;margin:0 4px;border:1px solid #e4e4e7;background:#f4f4f5;padding:0 6px;font-size:16px;font-weight:600;color:#646363;vertical-align:2px\">reasoning<\u002Fspan><\u002Fli>\n          <li><span>Little UK evidence covers secondary schools; the trial base is concentrated in primary settings.<span style=\"display:inline-flex;align-items:center;margin:0 4px;border:1px solid #f3d99a;background:#fff6e3;padding:0 6px;font-size:16px;font-weight:600;color:#8a5a00;vertical-align:2px\">gap<\u002Fspan><\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <section style=\"margin-top:14px;border:1px solid #e4e4e7;padding:20px 22px\">\n        <h3 id=\"b-family\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">3 · Family, community and early-years approaches<\u002Fh3>\n        <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">These approaches are promising where they are coordinated, and weakest where delivery depends on families staying engaged.<\u002Fp>\n        <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ t3 }}\" style=\"margin-top:12px;display:inline-flex;cursor:pointer;align-items:center;gap:6px;font-size:16px;font-weight:700;color:#0000FF\">{{ l3 }}<\u002Fdiv>\n        <sc-if value=\"{{ o3 }}\" hint-placeholder-val=\"{{ false }}\">\n        <ul style=\"margin:16px -22px -20px;border-top:1px solid #e4e4e7;background:#fafafa;padding:18px 22px 18px 42px;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:25px;color:#1c1c1e\">\n          <li><span>Family-based weight-management programmes show <b style=\"font-weight:700\">modest short-term BMI effects<\u002Fb> among families who complete them, but attrition is high<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[7]<\u002Fspan><\u002Fspan> and reach into the most affected communities is poor.<\u002Fli>\n          <li><span>Whole-systems community approaches — local authorities coordinating food, planning and schools — report <b style=\"font-weight:700\">promising early signals<\u002Fb> on prevalence in a small number of evaluated sites<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[8]<\u002Fspan><\u002Fspan>, though evaluations are young and rely on routine measurement data.<\u002Fli>\n          <li><span>Early years is the <b style=\"font-weight:700\">thinnest theme<\u002Fb>: UK studies are few, and the strongest infant-feeding signals come from international trials whose transferability is untested.<span style=\"display:inline-flex;align-items:center;margin:0 4px;border:1px solid #f3d99a;background:#fff6e3;padding:0 6px;font-size:16px;font-weight:600;color:#8a5a00;vertical-align:2px\">gap<\u002Fspan><\u002Fspan><\u002Fli>\n        <\u002Ful>\n        <\u002Fsc-if>\n      <\u002Fsection>\n\n      <h2 id=\"b-intl\" style=\"margin:38px 0 0;border-top:1px solid #e4e4e7;padding-top:26px;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">International comparisons<\u002Fh2>\n      <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">Four programmes carry enough evaluation to be read alongside the UK trial base. Together they separate the two mechanisms that matter: changing what industry supplies, and changing what households choose.<\u002Fp>\n\n      <section style=\"margin-top:24px\">\n        <h3 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">United Kingdom — Soft Drinks Industry Levy (since 2018)<\u002Fh3>\n        <p style=\"margin:10px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">A tiered levy charged to manufacturers rather than consumers, set with a sugar threshold that producers could reformulate below. <span>Sugar in eligible drinks fell <b style=\"font-weight:700\">43.7%<\u002Fb> between 2015 and 2020, and sugar purchased per household fell without any fall in soft-drink volume — the signature of reformulation rather than reduced buying.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openMulti }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[1,2]<\u002Fspan><\u002Fspan> Strong evidence, from a controlled interrupted time series.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"margin-top:26px\">\n        <h3 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">Mexico — Sugary drinks excise tax (since 2014)<\u002Fh3>\n        <p style=\"margin:10px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">A flat one-peso-per-litre tax on sugar-sweetened beverages, passed through to shelf prices rather than absorbed by producers. Purchases of taxed drinks fell around <b style=\"font-weight:700\">7.6%<\u002Fb> over two years, with the largest reductions in the lowest-income households.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[9]<\u002Fspan> Where reformulation is not available as a lever, price does the work — but the burden falls on shoppers, not manufacturers. Strong evidence, from household panel data.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"margin-top:26px\">\n        <h3 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">Chile — Warning labels and marketing restrictions (since 2016)<\u002Fh3>\n        <p style=\"margin:10px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">Black octagon front-of-pack warnings combined with restrictions on child-directed marketing and school sales. Purchases of drinks labelled \"high in sugar\" fell around <b style=\"font-weight:700\">24%<\u002Fb>.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[10]<\u002Fspan> The package outperformed any single measure in the base: labels informed the choice while the marketing restrictions removed the counter-pressure. Strong evidence, quasi-experimental.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"margin-top:26px\">\n        <h3 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:700;color:#0F294A\">Amsterdam — Healthy Weight Programme (since 2012)<\u002Fh3>\n        <p style=\"margin:10px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">A whole-city approach coordinating schools, sport, planning, health services and food retail under one programme. Childhood overweight fell around <b style=\"font-weight:700\">12%<\u002Fb> city-wide.<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openSource }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[11]<\u002Fspan> This is the clearest whole-systems signal available and the closest analogue to English local-authority action — but it rests on routine measurement data with no counterfactual, so it should be read as promising rather than proven. Moderate evidence.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"margin-top:38px;border-top:1px solid #e4e4e7;padding-top:26px\">\n        <h2 id=\"b-concl\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">Conclusions<\u002Fh2>\n        <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">Overall, <span>the evidence points more strongly to <b style=\"font-weight:700\">population-level food-environment measures<\u002Fb> than to school-only programmes<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openMulti }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;margin:0 4px;border:1px solid #c7c7ff;background:#ececff;padding:0 6px;font-size:16px;font-weight:600;color:#0000FF;vertical-align:2px\">[1,4]<\u002Fspan><\u002Fspan>. Three things follow for a policy reader.<\u002Fp>\n        <ul style=\"margin:14px 0 0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:10px;font-size:19px;line-height:25px;color:#1c1c1e\">\n          <li><b style=\"font-weight:700;color:#0F294A\">The mechanism is settled; the outcome is not.<\u002Fb> The best-supported measures reliably reduce the sugar supplied or purchased. Only one UK study reaches children's weight, and its effect is confined to year-6 girls in the most deprived areas.<\u002Fli>\n          <li><b style=\"font-weight:700;color:#0F294A\">Design matters more than instrument.<\u002Fb> The levy worked because the threshold gave manufacturers a reason to reformulate; Mexico's tax worked through price, and Chile's package worked because labels and marketing restrictions pulled in the same direction. A measure that leaves the counter-pressure intact performs worse.<\u002Fli>\n          <li><b style=\"font-weight:700;color:#0F294A\">Schools are not a substitute for the wider environment.<\u002Fb> The two largest UK trials are well-powered nulls on BMI. That reads as insufficient dose against an obesogenic environment rather than as evidence that schools are irrelevant.<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin:14px 0 0;font-size:19px;line-height:25px;color:#1c1c1e\">The base is therefore useful for deciding where to look harder and which levers to combine, but it does not yet support a simple ranking of every intervention type.<span style=\"display:inline-flex;align-items:center;margin:0 4px;border:1px solid #e4e4e7;background:#f4f4f5;padding:0 6px;font-size:16px;font-weight:600;color:#646363;vertical-align:2px\">reasoning<\u002Fspan><\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"margin-top:38px;border-top:1px solid #e4e4e7;padding-top:26px\">\n        <h2 id=\"b-refs\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">References<\u002Fh2>\n        <ol style=\"margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ references }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <li style=\"display:flex;gap:12px;font-size:19px;line-height:25px\">\n              <span style=\"flex-shrink:0;font-weight:700;color:#0F294A\">{{ r.tag }}<\u002Fspan>\n              <span><span style=\"color:#0F294A\">{{ r.authors }} <\u002Fspan><span sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;font-weight:600;color:#0F294A\" style-hover=\"color:#0000FF;text-decoration:underline\">{{ r.title }}<\u002Fspan><span style=\"font-style:italic;color:#646363\">{{ r.meta }}<\u002Fspan><\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fsection>\n\n      <div style=\"margin-top:32px;border-top:1px solid #e4e4e7;padding-top:22px\">\n        <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ goSummary }}\" style=\"display:inline-flex;cursor:pointer;align-items:center;gap:8px;border:1px solid #0000FF;padding:11px 18px;font-size:19px;font-weight:700;line-height:25px;color:#0000FF\" style-hover=\"background:#ececff\">← Back to summary<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showFab }}\" hint-placeholder-val=\"{{ true }}\">\n  <div role=\"button\" tabindex=\"0\" aria-label=\"Chat about this report\" sc-camel-on-click=\"{{ openChat }}\" style=\"position:fixed;right:24px;bottom:24px esity in the UK?': 'Childhood obesity — what works',\n      'Has the levy changed what children drink at home?': 'Soft drinks levy — what changed',\n      'Which local authorities cut prevalence, and how?': 'Local authorities — what worked',\n      'What do parents actually change after a programme ends?': 'Parents — what changes stick',\n      'Do free school meals change what children eat at home?': 'Free school meals — spillover',\n      'How does household food insecurity track with fuel poverty?': 'Food insecurity and fuel poverty',\n      'What works to reach families in the most deprived areas?': 'Reaching deprived areas',\n      'What do early years settings serve at mealtimes?': 'Early years mealtimes',\n      'Do cold and damp homes affect child development?': 'Cold homes and child development',\n      'Do cold and damp homes affect health outcomes?': 'Cold homes and health',\n      'How do low-income families weigh cost against quality?': 'Cost against quality',\n      'How do low-income households experience upfront costs?': 'Upfront costs and low incomes',\n      'What does retrofit disruption mean for families with young children?': 'Retrofit disruption for families'\n    };\n  }\n\n  shortTitle(s) {\n    const raw = ((s || this.state).question || '').replace(/\\s+/g, ' ').trim();\n    const known = this.shortLabels()[raw];\n    if (known) return known;\n    if (!raw) return 'Untitled search';\n    return raw.length > 42 ? raw.replace(/\\?$/, '').slice(0, 40).trim() + '…' : raw.replace(/\\?$/, '');\n  }\n\n  derivedShortTitle(s) {\n    const q = ((s || this.state).question || '').replace(/\\s+/g, ' ').trim().replace(/\\?$/, '');\n    if (!q) return 'Untitled report';\n    if (/obesity/i.test(q)) return 'Childhood obesity — what works';\n    if (/food environment/i.test(q)) return 'Food environment — what works';\n    const stop = ['what', 'which', 'how', 'do', 'does', 'did', 'are', 'is', 'the', 'a', 'an', 'to', 'in', 'of', 'and', 'for', 'work', 'works', 'effective', 'reduce', 'improve'];\n    const words = q.split(' ').filter((w) => stop.indexOf(w.toLowerCase().replace(/[^a-z]/gi, '')) === -1);\n    const topic = words.slice(0, 4).join(' ');\n    const title = topic || q.split(' ').slice(0, 4).join(' ');\n    return title.charAt(0).toUpperCase() + title.slice(1) + ' — what works';\n  }\n\n  sharpenedQuestion(s) {\n    const q = ((s || this.state).question || '').trim();\n    if (!q) return '';\n    if (/obesity/i.test(q)) return 'Which interventions, programmes or policies reduce childhood obesity, and what does the evidence imply about their effectiveness and applicability in the UK?';\n    if (/food environment/i.test(q)) return 'Which interventions to improve food environments are effective, and what does the evidence imply about their transferability and likely applicability to the UK?';\n    return q;\n  }\n\n  countryList() {\n    return [\n      { title: 'United Kingdom — Soft Drinks Industry Levy', detail: 'A tiered levy charged to manufacturers, not consumers, with a threshold they could reformulate below.', result: 'Sugar in eligible drinks fell 43.7%.', cite: '[1,2]', strength: 'Strong', meta: 'Controlled time series · since 2018' },\n      { title: 'Mexico — Sugary drinks excise tax', detail: 'A flat one-peso-per-litre tax on sugar-sweetened beverages, passed through to shelf prices.', result: 'Purchases of taxed drinks fell 7.6% in two years.', cite: '[9]', strength: 'Strong', meta: 'Household panel · since 2014' },\n      { title: 'Chile — Warning labels and marketing ban', detail: 'Black octagon front-of-pack warnings, plus restrictions on child-directed marketing and school sales.', result: 'High-sugar drink purchases fell 24%.', cite: '[10]', strength: 'Strong', meta: 'Quasi-experimental · since 2016' }\n    ];\n  }\n\n  keyFindings() {\n    return [\n      { cite: '[1,2]', text: 'The levy worked on sugar: Sugar bought in soft drinks fell 29.5 g per household per week — driven by reformulation, not by households buying less.' },\n      { cite: '[3]', text: 'One signal on actual weight: Obesity prevalence among year-6 girls in the most deprived areas fell 1.6 percentage points. No effect detected in boys.' },\n      { cite: '[4,5,6]', text: 'School programmes move behaviour, not BMI: The two largest UK cluster-randomised trials found no BMI difference at 24 months, despite measurable activity gains.' },\n      { cite: '[8]', text: 'Whole-systems local action looks promising: Participating local authorities recorded a small relative fall in year-6 prevalence against matched comparators — but evaluations are young.' },\n      { cite: '', gap: true, text: 'Main evidence gap: No study yet links promotion-placement restrictions to weight outcomes — purchasing data only.' }\n    ];\n  }\n\n  keyFindingsOld() {\n    return [\n      { cite: '[5,1,3]', text: 'School-based programmes are the most developed strand: prior reviews found most evaluated prevention studies in primary schools, and meta-analyses report statistically significant but small BMI and BMI z-score reductions, with Cochrane evidence mixed by intervention type and certainty.' },\n      { cite: '[1]', text: 'Programme design matters within school interventions: physical-activity programmes had larger BMI effects when they included curricular sessions or emphasised enjoyment, while no component characteristics were consistently linked to better multicomponent effects.' },\n      { cite: '[2]', text: 'Parent and family programmes more often improve behaviours than sustained weight: early-childhood parent-focused reviews found short-term but not long-term combined effects, and eHealth reviews found no significant BMI/BMI z-score improvement despite some dietary or activity gains.' },\n      { cite: '[9,10]', text: 'Population-level policy packages are wide-ranging: taxes, marketing regulation, labelling, procurement, whole-school policies and active environments; reported examples show reduced sugary-drink consumption in Mexico and early changes in knowledge, consumption and reformulation in Chile.' },\n      { cite: '[4,7,11]', text: 'Implementation conditions shape delivery: time, staffing, training, fidelity, local resources, adherence and cultural or socioeconomic context recur across the evidence as factors affecting delivery and scale-up.' }\n    ];\n  }\n\n  sectionList() {\n    const kf = this.keyFindingsOld();\n    return [\n      {\n        id: 'effectiveness', short: 'Effectiveness', title: 'What the evidence shows about effectiveness for preventing or reducing childhood obesity',\n        summary: 'School-delivered diet and physical activity programmes show small reductions in BMI measures, while parent-focused digital approaches show no significant BMI improvement but some diet or activity gains.',\n        detail: [{ text: kf[0].text, cite: kf[0].cite }, { text: kf[2].text, cite: kf[2].cite }]\n      },\n      {\n        id: 'school', short: 'Schools', title: 'School-based diet, physical activity and school food interventions',\n        summary: 'The school-age evidence is mainly about packages delivered through schools—nutrition education, opportunities for physical activity, healthier diet promotion and, in some studies, links to home—rather than isolated lessons or single school-food changes.',\n        detail: [{ text: kf[1].text, cite: kf[1].cite }, { text: 'The two largest UK cluster-randomised trials found no significant effect on BMI at 24 months.', cite: '[4,5]' }]\n      },\n      {\n        id: 'family', short: 'Family and early years', title: 'Family, parent-engagement and early-life prevention programmes',\n        summary: 'Family and early-life programmes in the documents are mainly behaviour-change approaches working through parents, carers and local services, with effects that are clearer for routines and health behaviours than for sustained weight change.',\n        detail: [{ text: kf[2].text, cite: kf[2].cite }]\n      },\n      {\n        id: 'community', short: 'Community and digital', title: 'Community, clinic and digital delivery models for children and families',\n        summary: 'Local delivery evidence is a mix of service and technology models rather than a single settled pathway: a high-level reading of the documents groups clinic, community and integrated care models around counselling, weight management and clinic-community delivery, with attention to fidelity, reach and cost-effectiveness.',\n        detail: [{ text: 'eHealth reviews found no significant BMI/BMI z-score improvement despite some dietary or activity gains.', cite: '[2]' }, { text: 'Whole-systems community approaches report promising early signals on prevalence in a small number of evaluated sites.', cite: '[8]' }]\n      },\n      {\n        id: 'population', short: 'Population policy', title: 'Population and policy-level measures for childhood obesity prevention',\n        summary: 'Population-level documents widen the prevention frame from individual behaviour change to food prices, marketing, labelling, public procurement, school environments and active places.',\n        detail: [{ text: kf[3].text, cite: kf[3].cite }]\n      },\n      {\n        id: 'implementation', short: 'Implementation', title: 'Implementation considerations reported across programmes and policies',\n        summary: 'Across the documents, implementation evidence is a strand in its own right: process evaluations and syntheses describe resources, training, fidelity, parental involvement, cultural tailoring and sustainability as recurrent delivery issues.',\n        detail: [{ text: kf[4].text, cite: kf[4].cite }]\n      },\n      {\n        id: 'equity', short: 'Equity', title: 'Equity, priority populations and culturally adapted interventions',\n        summary: 'Equity-focused evidence is concentrated on adapting family, home-visiting and community programmes for specific groups, rather than on proving that the same intervention works equally across populations.',\n        detail: []\n      },\n      {\n        id: 'costs', short: 'Costs', title: 'Costs, cost-effectiveness and resource implications',\n        summary: 'The formal cost-effectiveness results identified here point in different directions: The Daily Mile school trial reported a favourable whole-sample economic result, whereas the Families for Health community treatment trial reported unfavourable cost-effectiveness against usual care.',\n        detail: [{ text: 'The Daily Mile school trial reported a favourable whole-sample economic result.', cite: '[5]' }, { text: 'The Families for Health community treatment trial reported unfavourable cost-effectiveness against usual care.', cite: '[7]' }]\n      },\n      {\n        id: 'conclusions', short: 'Conclusions', title: 'Conclusions',\n        summary: 'A high-level reading of the documents shows that childhood obesity interventions have been evaluated across schools, families, early life, local services, digital delivery, population policy, implementation and equity-focused adaptation.',\n        detail: []\n      }\n    ];\n  }\n\n  topSources() {\n    return [\n      { ref: '[1]', claim: 'The clearest evidence favours measures that change the food environment, especially the Soft Drinks Industry Levy.', strength: 'Strong', tag: 'UK · quasi-experimental', meta: 'BMJ Public Health, 2021', title: 'Household purchasing of soft drinks after the UK Soft Drinks Industry Levy', insight: 'The cleanest causal read in the base. It separates reformulation from consumer behaviour — which is why the levy\\u2019s mechanism is settled and its weight effect is not.' },\n      { ref: '[3]', claim: 'Obesity prevalence among year-6 girls in the most deprived areas fell after the levy; no effect was detected in boys.', strength: 'Strong', tag: 'UK · weight outcome', meta: 'PLOS Medicine, 2023', title: 'Changes in obesity prevalence among 10–11-year-olds after the soft drinks levy', insight: 'The only study he gramme: industry progress 2015–2020 (national evaluation)', meta: ' — OHID, 2022' },\n      { claim: 'Obesity prevalence among year-6 girls in the most deprived areas fell after the levy; no effect was detected in boys.', type: 'Interrupted time series', tag: '[3]', authors: 'Rogers NT, Cummins S, Forde H, et al.', title: 'Changes in obesity prevalence among 10–11-year-olds after the soft drinks levy: interrupted time series by deprivation quintile', meta: ' — PLOS Medicine, 2023' },\n      { strength: 'Strong', type: 'Cluster-randomised trial', geo: 'UK', quote: 'There was no significant difference in BMI z-score between intervention and control children at 24 months (adjusted mean difference −0.075, 95% CI −0.183 to 0.033).', locator: 'Results, table 3', findings: [{ stat: 'No effect', unit: 'BMI z-score at 24 months' }, { stat: '+ activity', unit: 'small gains in reported physical activity' }], uses: ['Key findings — school programmes move behaviour, not BMI', 'Themes — school-based programmes'], claim: 'The two largest UK cluster-randomised trials found no significant effect on BMI at 24 months.', tag: '[4]', authors: 'Adab P, Pallan MJ, Lancashire ER, et al.', title: 'The WAVES cluster-randomised controlled trial of a multi-component school intervention', meta: ' — BMJ, 2018' },\n      { strength: 'Moderate', type: 'Pragmatic evaluation', geo: 'UK', quote: 'Daily-mile participation was associated with improved fitness and activity, with no measurable change in BMI over the school year.', locator: 'Results, p. 6', findings: [{ stat: 'No change', unit: 'BMI over one school year' }], uses: ['Themes — school-based programmes'], claim: 'Active-mile initiatives improved fitness without a measurable change in BMI.', tag: '[5]', authors: 'Chesham RA, Booth JN, Sweeney EL, et al.', title: 'Active-mile initiatives in English primary schools: pragmatic evaluation', meta: ' — International Journal of Behavioral Nutrition, 2020' },\n      { strength: 'Strong', type: 'Umbrel ites.', tag: '[8]', authors: 'Bagnall AM, Radley D, Jones R, et al.', title: 'Whole-systems obesity programmes in English local authorities: three-year outcome evaluation', meta: ' — The Lancet Public Health, 2024' },\n      { strength: 'Strong', type: 'Household panel', geo: 'Mexico', quote: 'Purchases of taxed beverages were 7.6% lower than the counterfactual over the two years following implementation, with the largest reductions among low-income households.', locator: 'Results, exhibit 2', findings: [{ stat: '−7.6%', unit: 'purchases of taxed drinks, 2 years' }], uses: ['Country highlights — Mexico', 'International comparisons'], claim: 'Mexico\\u2019s excise tax reduced purchases of taxed drinks, with the largest effect in low-income households.', tag: '[9]', authors: 'Colchero MA, Rivera-Dommarco J, Popkin BM, et al.', title: 'In Mexico, evidence of sustained consumer response two years after implementing a sugar-sweetened beverage tax', meta: ' — Health Affairs, 2017' },\n      { strength: 'Strong', type: 'Quasi-experimental', geo: 'Chile', quote: 'Purchases of beverages labelled high in sugar fell 23.7% relative to the counterfactual after the labelling and marketing regulations took effect.', locator: 'Results, table 2', findings: [{ stat: '−23.7%', unit: 'purchases of high-in-sugar drinks' }], uses: ['Country highlights — Chile', 'International comparisons'], claim: 'Chile\\u2019s warning labels and marketing restrictions reduced purchases of high-sugar drinks.', tag: '[10]', authors: 'Taillie LS, Reyes M, Colchero MA, et al.', title: 'An evaluation of Chile\\u2019s law of food labelling and advertising on sugar-sweetened beverage purchases', meta: ' — PLOS Medicine, 2020' },\n      { strength: 'Moderate', type: 'Routine data', geo: 'Netherlands', quote: 'City-wide prevalence of overweight among Amsterdam children fell around 12% over the programme period, with larger falls in lower-income districts.', locator: 'Results, p. 5', findings: [{ stat: '−12%', u
