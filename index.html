document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

1 21\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fform>\n\n        <div style=\"margin-top:44px;font-size:16px;line-height:20px;color:#9fb3cc\">{{ finderHint }}<\u002Fdiv>\n        <div style=\"margin-top:10px;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ finderRows }}\" as=\"r\" hint-placeholder-count=\"4\">\n            <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ r.open }}\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:16px 2px;font-size:24px;font-weight:800;line-height:30px;color:#fff;text-wrap:pretty\" style-hover=\"color:#7f9cff\">{{ r.title }}\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"square\" aria-hidden=\"true\" style=\"flex-shrink:0\"><path d=\"M7 3.5 15 11l-8 7.5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ================= PROJECTS ================= -->\n  <sc-if value=\"{{ isProjects }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:40px 24px 96px\">\n    <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A\">Projects<\u002Fh1>\n\n    <p style=\"margin:10px 0 0;max-width:{{ halfWidth }};font-size:19px;line-height:25px;color:#576980\">AI groups and tags searches projects by theme. <span role=\"button\" tabindex=\"0\" style=\"cursor:pointer;font-weight:700;color:#0F294A;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#0000FF\">Change settings<\u002Fspan> to group and tag searches manually.<\u002Fp>\n    <div style=\"margin-top:20px;display:flex;flex-direction:column;gap:44px\">\n      <sc-for list=\"{{ missionGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <section>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid #0F294A;padding-bottom:10px\">\n            <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ g.open }}\" style=\"cursor:pointer;color:#0F294A;text-decoration:underline;text-underline-offset:4px\" style-hover=\"color:#0000FF\">{{ g.name }}<\u002Fspan><\u002Fh2>\n            <span style=\"display:flex;align-items:baseline;gap:16px;font-size:16px;line-height:20px;color:#646363\">{{ g.count }}<span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ g.open }}\" style=\"cursor:pointer;font-weight:800;color:#0F294A;text-decoration:underline;text-underline-offset:3px;white-space:nowrap\" style-hover=\"color:#0000FF\">{{ g.seeAll }}<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;max-width:48em;font-size:19px;line-height:25px;color:#576980;text-wrap:pretty\">{{ g.aim }}<\u002Fp>\n          <div style=\"margin-top:18px;display:grid;grid-template-columns:{{ projectCols }};gap:24px\">\n            <sc-for list=\"{{ g.items }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ p.open }}\" style=\"cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;gap:24px;min-height:190px;border:1px solid #e4e4e7;background:#fff;padding:22px 24px 24px\" style-hover=\"border-color:#c7c7ff\">\n                <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                  <h3 style=\"margin:0;max-width:15em;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;line-height:25px;color:#0F294A;text-wrap:pretty\">{{ p.title }}<\u002Fh3>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px\">\n                  <span style=\"display:inline-flex;align-items:center;gap:8px;background:{{ p.chipBg }};padding:7px 12px;font-size:16px;font-weight:600;line-height:20px;color:{{ p.chipColour }}\">\n                    <span style=\"height:8px;width:8px;border-radius:50%;background:{{ p.dot }}\"><\u002Fspan>{{ p.state }}\n                  <\u002Fspan>\n                  <span style=\"font-size:16px;line-height:20px;color:#646363\">{{ p.meta }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div role=\"button\" tabindex=\"0\" style=\"cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:center;min-height:190px;border:1px dashed #c7c7d1;background:#fff;font-size:19px;font-weight:600;color:#576980\" style-hover=\"border-color:#0000FF;color:#0000FF\">+ New search<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= PROJECT ================= -->\n  <sc-if value=\"{{ isProject }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:32px 24px 96px\">\n\n    <div style=\"display:flex;align-items:center;gap:10px;font-size:16px;line-height:20px;color:#646363\">\n      <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ goProjects }}\" style=\"cursor:pointer;font-weight:700;color:#0000FF;text-decoration:underline;text-underline-offset:3px\">Projects<\u002Fspan>\n      <span style=\"color:#d3d3d8\">/<\u002Fspan>\n      <span>{{ openProjectName }}<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px\">\n      <div style=\"flex:1 1 320px;min-width:0;max-width:calc(100% - 200px)\">\n        <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A\">{{ openProjectName }}<\u002Fh1>\n        <p style=\"margin:8px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980;text-wrap:pretty\">{{ projectBlurb }}<\u002Fp>\n        <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ projectThemes }}\" as=\"t\" hint-placeholder-count=\"5\">\n            <span style=\"border:1px solid #c7c7ff;background:#ececff;padding:5px 10px;font-size:16px;font-weight:700;line-height:20px;color:#0000FF\">{{ t.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ goNewSearch }}\" style=\"flex-shrink:0;display:inline-flex;cursor:pointer;align-items:center;gap:22px;font-size:24px;font-weight:400;line-height:30px;color:#0F294A\" style-hover=\"color:#0000FF\">New search\n        <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linecap=\"square\" stroke-linejoin=\"miter\" aria-hidden=\"true\"><path d=\"M7 3.5 15 11l-8 7.5\"><\u002Fpath><\u002Fsvg>\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:22px;display:flex;flex-wrap:wrap;gap:14px 32px;border-top:1px solid #e4e4e7;border-bottom:1px solid #e4e4e7;padding:16px 0\">\n      <sc-for list=\"{{ projectStats }}\" as=\"m\" hint-placeholder-count=\"4\">\n        <div>\n          <div style=\"font-size:16px;line-height:20px;color:#646363\">{{ m.label }}<\u002Fdiv>\n          <div style=\"margin-top:2px;font-size:19px;line-height:25px;font-weight:700;color:#0F294A\">{{ m.value }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <section style=\"margin-top:34px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px\">\n        <h2 id=\"project-searches\" style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A\">Searches<\u002Fh2>\n        <sc-if value=\"{{ projectHasSearches }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:16px;line-height:20px;color:#646363\">{{ searchCountLine }} · marked stale after 12 months<\u002Fspan><\u002Fsc-if>\n      <\u002Fdiv>\n      <sc-if value=\"{{ projectEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:16px;border-top:1px solid #e4e4e7;padding-top:20px\">\n          <p style=\"margin:0;max-width:40em;font-size:19px;line-height:25px;color:#576980\">No searches yet. Run one, or add an existing search from another project.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ projectHasSearches }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ projectFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ f.select }}\" style=\"cursor:pointer;border:1px solid {{ f.border }};background:{{ f.bg }};padding:7px 12px;font-size:16px;font-weight:700;line-height:20px;color:{{ f.colour }}\">{{ f.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column\">\n        <sc-for list=\"{{ projectSearches }}\" as=\"r\" hint-placeholder-count=\"8\">\n          <div role=\"button\" tabindex=\"0\" style=\"cursor:pointer;display:grid;grid-template-columns:{{ searchCols }};gap:6px 24px;align-items:baseline;border-top:1px solid #e4e4e7;padding:16px 0\" style-hover=\"background:#f7f7f9\">\n            <span style=\"min-width:0;font-size:19px;line-height:25px;font-weight:600;color:#0F294A;text-wrap:pretty\">{{ r.title }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:20px;color:#646363;white-space:nowrap\">{{ r.sources }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:20px;color:#646363;white-space:nowrap\">{{ r.when }}<\u002Fspan>\n            <span style=\"font-size:16px;line-height:20px;font-weight:700;color:{{ r.stateColour }};white-space:nowrap\">{{ r.state }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ projectShowAll }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:18px;border-top:1px solid #e4e4e7;padding-top:16px\">\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleAllSearches }}\" style=\"cursor:pointer;font-size:19px;font-weight:800;line-height:25px;color:#0000FF;text-decoration:underline;text-underline-offset:3px\">{{ allSearchesLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ projectHasClaims }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"margin-top:34px;border-top:1px solid #e4e4e7;padding-top:26px\">\n      <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A\">What this project knows<\u002Fh2>\n      <p style=\"margin:6px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980\">Written by Policy Atlas from the searches in this project, and updated as new searches land.<\u002Fp>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column;gap:0\">\n        <sc-for list=\"{{ projectClaims }}\" as=\"k\" hint-placeholder-count=\"4\">\n          <div style=\"display:grid;grid-template-columns:{{ claimCols }};gap:8px 24px;align-items:baseline;border-top:1px solid #e4e4e7;padding:16px 0\">\n            <p style=\"margin:0;min-width:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\"><b style=\"font-weight:800;color:#0F294A\">{{ k.lead }}<\u002Fb> {{ k.body }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n              <span style=\"border:1px solid {{ k.tagBorder }};background:{{ k.tagBg }};padding:4px 10px;font-size:16px;font-weight:700;line-height:20px;color:{{ k.tagColour }};white-space:nowrap\">{{ k.confidence }}<\u002Fspan>\n              <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ k.show }}\" style=\"cursor:pointer;font-size:16px;line-height:20px;font-weight:700;color:#0000FF;white-space:nowrap;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#0000d6\">{{ k.backing }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <\u002Fsc-if>\n\n    <section style=\"margin-top:34px;border-top:1px solid #e4e4e7;padding-top:26px\">\n      <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A\">Searches you might add<\u002Fh2>\n      <p style=\"margin:6px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980\">From other missions, matched on theme. A search can sit under more than one mission.<\u002Fp>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column\">\n        <sc-for list=\"{{ suggestedSearches }}\" as=\"x\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:{{ suggestCols }};gap:6px 24px;align-items:baseline;border-top:1px solid #e4e4e7;padding:16px 0\">\n            <span style=\"min-width:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ x.title }}<span style=\"color:#646363\"> · already in {{ x.home }}<\u002Fspan><\u002Fspan>\n            <span style=\"font-size:16px;line-height:20px;color:#646363;white-space:nowrap\">{{ x.why }}<\u002Fspan>\n            <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ x.add }}\" style=\"cursor:pointer;font-size:16px;font-weight:800;line-height:20px;color:{{ x.actionColour }};white-space:nowrap;text-decoration:{{ x.actionDecoration }};text-underline-offset:3px\">{{ x.action }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ projectHasSearches }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"margin-top:34px;border-top:1px solid #e4e4e7;padding-top:26px\">\n      <h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#0F294A\">Where the project is thin<\u002Fh2>\n      <p style=\"margin:6px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980\">Themes the searches touch but have not covered in depth.<\u002Fp>\n      <div style=\"margin-top:16px;display:flex;flex-direction:column\">\n        <sc-for list=\"{{ projectGaps }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:{{ gapCols }};gap:6px 24px;align-items:baseline;border-top:1px solid #e4e4e7;padding:14px 0\">\n            <span style=\"min-width:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ g.text }}<\u002Fspan>\n            <span role=\"button\" tabindex=\"0\" style=\"cursor:pointer;font-size:16px;font-weight:800;line-height:20px;color:#0000FF;white-space:nowrap;text-decoration:underline;text-underline-offset:3px\">Search this<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= NEW SEARCH ================= -->\n  <sc-if value=\"{{ isNewSearch }}\" hint-placeholder-val=\"{{ true }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:36px 24px 120px;display:flex;justify-content:center\">\n    <div style=\"width:100%;max-width:{{ planColWidth }}\">\n      <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">New search<\u002Fdiv>\n      <h1 style=\"margin:8px 0 0;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A;text-wrap:pretty\">What do you need evidence on?<\u002Fh1>\n      <p style=\"margin:12px 0 0;font-size:19px;line-height:25px;color:#576980;text-wrap:pretty\">Ask a policy question in your own words. Policy Atlas will draft a plan for you to check before anything runs.<\u002Fp>\n\n      <form sc-camel-on-submit=\"{{ startSearch }}\" style=\"margin-top:24px\">\n        <div style=\"box-sizing:border-box;display:flex;align-items:flex-end;gap:12px;border:1px solid #d3d3d8;background:#fff;padding:14px 14px 14px 18px\" style-focus-within=\"border-color:#0000FF\">\n          <textarea value=\"{{ question }}\" sc-camel-on-change=\"{{ setQuestion }}\" sc-camel-on-key-down=\"{{ questionKeyDown }}\" rows=\"3\" placeholder=\"e.g. What works to reduce childhood obesity in the UK?\" style=\"flex:1;min-width:0;resize:none;border:none;background:transparent;padding:2px 0;font-family:'Mulish',system-ui,sans-serif;font-size:19px;line-height:25px;color:#1c1c1e;outline:none\"><\u002Ftextarea>\n          <button type=\"submit\" disabled=\"{{ startDisabled }}\" aria-label=\"Draft a plan\" style=\"flex-shrink:0;cursor:{{ startCursor }};display:flex;align-items:center;justify-content:center;width:40px;height:40px;border:none;border-radius:50%;background:{{ startColour }};color:#fff\" style-hover=\"background:#0000d6\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 13V3\"><\u002Fpath><path d=\"M3.5 7.5 8 3l4.5 4.5\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"margin-top:8px;font-size:16px;line-height:20px;color:#646363\">Enter to send · Shift+Enter for a new line · nothing runs until you approve the plan<\u002Fdiv>\n      <\u002Fform>\n\n      <div style=\"margin-top:40px;border-top:1px solid #e4e4e7;padding-top:20px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Or start from an example<\u002Fdiv>\n      <div style=\"margin-top:6px;display:flex;flex-direction:column\">\n        <sc-for list=\"{{ exampleQuestions }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ q.use }}\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #e4e4e7;padding:14px 2px;font-size:19px;line-height:25px;color:#0F294A;text-wrap:pretty\" style-hover=\"color:#0000FF\">{{ q.text }} <span style=\"flex-shrink:0;color:#0000FF\">→<\u002Fspan><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= SOURCES ================= -->\n  <sc-if value=\"{{ isSources }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:32px 24px {{ mainPadBottom }}\">\n    <div style=\"box-sizing:border-box;background:#fff;outline:1px solid #e4e4e7;outline-offset:-1px;padding:0 0 44px\">\n      <div style=\"box-sizing:border-box;padding:36px 40px 0\">\n      <div role=\"radiogroup\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid rgba(15,41,74,.3)\">\n        <sc-for list=\"{{ srcTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div role=\"radio\" tabindex=\"0\" aria-checked=\"{{ t.checked }}\" sc-camel-on-click=\"{{ t.select }}\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 12px;font-size:16px;line-height:20px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:{{ t.bg }};color:{{ t.colour }}\">{{ t.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"box-sizing:border-box;padding:0 40px\">\n      <p style=\"margin:22px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980\">{{ sourceCount }}<\u002Fp>\n\n      <sc-if value=\"{{ srcPaneThemes }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top:26px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Key themes<\u002Fdiv>\n        <div style=\"margin-top:8px;display:flex;flex-direction:column\">\n          <sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div style=\"border-top:1px solid #e4e4e7;padding:18px 0\">\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px\">\n                <span style=\"min-width:0;font-size:19px;line-height:25px;font-weight:800;color:#0F294A;text-wrap:pretty\">{{ t.title }}<\u002Fspan>\n                <span style=\"flex-shrink:0;font-size:16px;line-height:20px;color:#646363\">{{ t.count }}<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:6px 0 0;max-width:60em;font-size:19px;line-height:25px;color:#576980;text-wrap:pretty\">{{ t.detail }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ srcPaneCharts }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:26px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Evidence landscape<\u002Fdiv>\n        <sc-for list=\"{{ chartGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"margin-top:22px\">\n            <div style=\"font-size:19px;line-height:25px;font-weight:800;color:#0F294A\">{{ g.title }}<\u002Fdiv>\n            <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ g.rows }}\" as=\"r\" hint-placeholder-count=\"8\">\n                <div style=\"display:grid;grid-template-columns:{{ g.labelCol }} 1fr auto;gap:12px;align-items:center\">\n                  <span style=\"min-width:0;font-size:16px;line-height:20px;color:#576980;text-align:right;text-wrap:pretty\">{{ r.label }}<\u002Fspan>\n                  <span style=\"display:block;height:16px;background:#f0f0f2\"><span style=\"display:block;height:16px;width:{{ r.pct }};background:#0F294A\"><\u002Fspan><\u002Fspan>\n                  <span style=\"font-size:16px;line-height:20px;font-weight:700;color:#0F294A;min-width:2.5em\">{{ r.value }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:22px\">\n          <div style=\"font-size:19px;line-height:25px;font-weight:800;color:#0F294A\">Where sources were published<\u002Fdiv>\n          <iframe src=\"about:blank#8b67c484-8f9e-41fb-967b-7d8d271a0f2b\" title=\"World map of where sources were published\" style=\"display:block;margin-top:12px;width:100%;height:470px;border:0\"><\u002Fiframe>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:22px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">From sources to evidence<\u002Fdiv>\n        <div style=\"margin-top:12px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ funnelRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div style=\"display:grid;grid-template-columns:11em 1fr auto;gap:12px;align-items:center\">\n              <span style=\"min-width:0;font-size:16px;line-height:20px;color:#576980;text-align:right;text-wrap:pretty\">{{ r.label }}<\u002Fspan>\n              <span style=\"display:block;height:16px;background:#f0f0f2\"><span style=\"display:block;height:16px;width:{{ r.pct }};background:#0F294A\"><\u002Fspan><\u002Fspan>\n              <span style=\"font-size:16px;line-height:20px;font-weight:700;color:#0F294A;min-width:2.5em\">{{ r.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ srcPaneList }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:8px\">\n        <sc-for list=\"{{ sourceFilters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ f.select }}\" style=\"cursor:pointer;border:1px solid {{ f.border }};background:{{ f.bg }};padding:7px 12px;font-size:16px;font-weight:700;line-height:20px;color:{{ f.colour }}\">{{ f.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:22px;overflow-x:auto\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;text-align:left\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px 10px 0;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Source<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Year<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Origin<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Evidence type<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Strength<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Relevant<\u002Fsc-raw-th>\n              <sc-raw-th style=\"border-bottom:2px solid #0F294A;padding:10px 0 10px 12px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Status<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ sourceRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n              <sc-raw-tr>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px 14px 0;min-width:22em;font-size:19px;line-height:25px;color:#0F294A;text-wrap:pretty\">\n                  {{ r.title }}\n                  <sc-if value=\"{{ r.cited }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:8px;border:1px solid #c7c7ff;background:#ececff;padding:1px 7px;font-size:16px;font-weight:700;color:#0000FF;white-space:nowrap\">Cited<\u002Fspan><\u002Fsc-if>\n                <\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px;font-size:16px;line-height:20px;color:#576980;white-space:nowrap\">{{ r.year }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px;font-size:16px;line-height:20px;color:#576980;white-space:nowrap\">{{ r.origin }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px;font-size:16px;line-height:20px;color:#576980;min-width:12em\">{{ r.type }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px;font-size:16px;line-height:20px;font-weight:700;color:{{ r.strengthColour }};white-space:nowrap\">{{ r.strength }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 12px;font-size:16px;line-height:20px;color:#576980;white-space:nowrap\">{{ r.relevant }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"border-bottom:1px solid #e4e4e7;padding:14px 0 14px 12px;font-size:16px;line-height:20px;color:#576980;white-space:nowrap\">{{ r.status }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ sourcesEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n              <sc-raw-tr><sc-raw-td colspan=\"7\" style=\"border-bottom:1px solid #e4e4e7;padding:20px 0;font-size:19px;line-height:25px;color:#576980\">No sources match this filter.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-if>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= HISTORY ================= -->\n  <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:32px 24px {{ mainPadBottom }}\">\n    <h1 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A\">History<\u002Fh1>\n    <p style=\"margin:8px 0 0;max-width:44em;font-size:19px;line-height:25px;color:#576980\">The audit trail for this search — the questions you answered, the plan you approved, and every step of the run.<\u002Fp>\n\n    <div style=\"margin-top:24px;border:1px solid #e4e4e7;background:#fff\">\n      <sc-for list=\"{{ historyRows }}\" as=\"r\" hint-placeholder-count=\"20\">\n        <div style=\"display:grid;grid-template-columns:{{ historyCols }};gap:6px 20px;align-items:center;border-top:1px solid #f0f0f2;border-left:4px solid {{ r.edge }};background:{{ r.rowBg }};padding:14px 20px\">\n          <span style=\"font-size:16px;line-height:20px;color:#646363;white-space:nowrap\">{{ r.when }}<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;border:1px solid {{ r.tagBorder }};background:{{ r.tagBg }};padding:4px 10px;font-size:16px;font-weight:700;line-height:20px;color:{{ r.tagColour }};white-space:nowrap\">{{ r.tag }}<\u002Fspan>\n          <span style=\"min-width:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ r.text }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0 auto;max-width:1180px;padding:32px 24px {{ mainPadBottom }}\">\n    <div style=\"background:#fff;outline:1px solid #e4e4e7;outline-offset:-1px;padding:32px 24px\">\n      <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">{{ stubTab }}<\u002Fdiv>\n      <p style=\"margin:8px 0 0;max-width:40em;font-size:19px;line-height:25px;color:#576980\">Not designed yet.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ================= PLAN ================= -->\n  <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"animation:rise 380ms cubic-bezier(.2,.7,.3,1) both;box-sizing:border-box;margin:0;width:100%;padding:{{ planPadTop }} 24px {{ planPadBottom }} 24px;display:grid;grid-template-columns:{{ planGridCols }};gap:24px;align-items:start;justify-content:center\">\n    <sc-if value=\"{{ chatColShown }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"position:sticky;top:{{ planPadTop }};box-sizing:border-box;width:100%;max-width:{{ planColWidth }};justify-self:center;height:calc(100vh - {{ chromeH }});border:1px solid #e4e4e7;background:#fff;padding:0;display:flex;flex-direction:column\">\n      <div id=\"plan-thread\" style=\"box-sizing:border-box;flex:1;min-height:0;overflow-y:auto;padding:0 36px 8px;display:flex;flex-direction:column;gap:30px\">\n        <div style=\"flex-shrink:0;background:#fff;padding:18px 0 14px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">{{ chatHeading }}<\u002Fdiv>\n\n\n\n      <div style=\"display:flex;justify-content:flex-end\">\n        <div style=\"max-width:82%;border:1px solid #e4e4e7;background:#f7f7f9;padding:14px 18px;font-size:19px;line-height:25px;color:#0F294A;text-wrap:pretty\">{{ rawQuestion }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ openingShown }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"margin:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">I'll sharpen this into an evidence question that covers both effectiveness and UK applicability, while keeping the intervention space broad unless you narrow it.<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{ planCards }}\" as=\"c\" hint-placeholder-count=\"1\">\n        <div style=\"margin-left:{{ botInset }};border-left:2px solid #0000FF;background:#f7f7f9;padding:18px 22px 20px\">\n          <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">{{ c.label }}<\u002Fdiv>\n          <div style=\"margin-top:6px;font-size:19px;line-height:25px;font-weight:800;color:#0F294A;text-wrap:pretty\">{{ c.title }}<\u002Fdiv>\n          <sc-if value=\"{{ c.hasTags }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:12px;display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ c.tags }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <span style=\"border:1px solid #c7c7ff;background:#ececff;padding:5px 10px;font-size:16px;font-weight:700;line-height:20px;color:#0000FF\">{{ t.text }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ c.confirmed }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top:14px;border-top:1px solid #e4e4e7;padding-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:16px;line-height:20px;color:#0F294A\">\n              <span style=\"font-weight:700;color:#00694a\">✓ Confirmed — {{ c.confirmedLabel }}<\u002Fspan>\n              <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ c.change }}\" style=\"cursor:pointer;font-weight:700;color:#0000FF;text-decoration:underline;text-underline-offset:3px\">Change<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ c.pending }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:14px;border-top:1px solid #e4e4e7;padding-top:12px;display:flex;flex-wrap:wrap;gap:10px\">\n              <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ c.confirm }}\" style=\"display:inline-flex;cursor:pointer;background:#0000FF;padding:11px 18px;font-size:16px;font-weight:800;line-height:20px;color:#fff;clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 0 100%)\" style-hover=\"background:#0000d6\">{{ c.confirmLabel }}<\u002Fspan>\n              <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ c.ask }}\" style=\"display:inline-flex;cursor:pointer;border:1px solid #e4e4e7;padding:10px 18px;font-size:16px;font-weight:800;line-height:20px;color:#0F294A\" style-hover=\"border-color:#c7c7ff;background:#f5f5ff;color:#0000FF\">Change this<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ c.showPlanLink }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-left:{{ botInset }};border-left:2px solid #00B08D;background:#0F294A;padding:20px 24px 22px\">\n            <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9fb3cc\">{{ c.linkLabel }}<\u002Fdiv>\n            <div style=\"margin-top:4px\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openPlanDoc }}\" style=\"cursor:pointer;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#fff;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#00B08D\">Plan updated<\u002Fspan><\u002Fdiv>\n            <div style=\"margin-top:6px;font-size:19px;line-height:25px;color:#9fb3cc\">{{ c.linkMeta }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ c.hasFollow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex\">\n        <div style=\"min-width:0;flex:1;display:flex;flex-direction:column;gap:16px\">\n          <p style=\"margin:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ c.follow }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ planReady }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <p style=\"margin:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ planDocIntro }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-left:{{ botInset }};border-left:2px solid #00B08D;background:#0F294A;padding:20px 24px 22px\">\n        <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#9fb3cc\">Ready<\u002Fdiv>\n        <div style=\"margin-top:4px\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ openPlanDoc }}\" style=\"cursor:pointer;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#fff;text-decoration:underline;text-underline-offset:3px\" style-hover=\"color:#00B08D\">The plan is ready to review<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:6px;font-size:19px;line-height:25px;color:#9fb3cc\">{{ planDocMeta }}<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ runInProgress }}\" hint-placeholder-val=\"{{ false }}\">\n      <div>\n        <p style=\"margin:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\">{{ runChatLine }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px\"> flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ planRules }}\" as=\"r\" hint-placeholder-count=\"7\">\n            <li style=\"display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start\">\n              <span style=\"margin-top:9px;height:7px;width:7px;background:#00B08D\"><\u002Fspan>\n              <span style=\"font-size:19px;line-height:25px;color:#dbe4ef;text-wrap:pretty\">{{ r.text }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showFinal }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"margin-top:30px;border-top:1px solid rgba(255,255,255,.22);padding-top:26px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#fff\">Agreed steps<\u002Fh2><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ editSteps }}\" style=\"flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.35);padding:4px 10px;font-size:16px;font-weight:700;line-height:20px;color:#fff\" style-hover=\"border-color:#00B08D;color:#00B08D\">Edit<\u002Fspan><\u002Fdiv>\n        <ol style=\"margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px\">\n          <sc-for list=\"{{ planSteps }}\" as=\"p\" hint-placeholder-count=\"7\">\n            <li style=\"display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start\">\n              <span style=\"font-size:19px;line-height:25px;font-weight:700;color:#9fb3cc\">{{ p.n }}<\u002Fspan>\n              <span style=\"font-size:19px;line-height:25px;color:#dbe4ef;text-wrap:pretty\"><b style=\"font-weight:800;color:#fff\">{{ p.name }}<\u002Fb> — {{ p.detail }}<\u002Fspan>\n            <\u002Fli>\n          <\u002Fsc-for>\n        <\u002Fol>\n      <\u002Fsection>\n\n      <section style=\"margin-top:30px;border-top:1px solid rgba(255,255,255,.22);padding-top:26px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px\"><h2 style=\"margin:0;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;line-height:30px;color:#fff\">Assumptions<\u002Fh2><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ editAssumptions }}\" style=\"flex-shrink:0;cursor:pointer;border:1px solid rgba(255,255,255,.35);padding:4px 10px;font-size:16px;font-weight:700;line-height:20px;color:#fff\" style-hover=\"border-color:#00B08D;color:#00B08D\">Edit<\u002Fspan><\u002Fdiv>\n        <ul style=\"margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;border-left:2px solid #00B08D;padding-left:20px\">\n          <sc-for list=\"{{ planAssumptions }}\" as=\"a\" hint-placeholder-count=\"5\">\n            <li style=\"font-size:19px;line-height:25px;color:#9fb3cc;text-wrap:pretty\">{{ a.text }}<\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fsection>\n\n      <div style=\"margin-top:30px;border-top:1px solid rgba(255,255,255,.22);padding-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ startRun }}\" style=\"display:inline-flex;cursor:pointer;background:#00B08D;padding:13px 20px;font-size:19px;font-weight:800;line-height:20px;color:#0F294A\" style-hover=\"background:#00c79f\">Start search<\u002Fspan>\n        <span style=\"font-size:16px;line-height:20px;color:#9fb3cc\">~10–20 min<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:30px;border-top:1px solid rgba(255,255,255,.22);padding-top:22px;display:flex;flex-direction:column;gap:10px\">\n        <sc-for list=\"{{ pendingParts }}\" as=\"p\" hint-placeholder-count=\"2\">\n          <div style=\"display:grid;grid-template-columns:1fr auto;gap:1   <a href=\"#references\" style=\"border:1px solid #e4e4e7;padding:6px 10px;font-size:16px;font-weight:600;color:#576980\">References<\u002Fa>\n        <a href=\"#how-gathered\" style=\"border:1px solid #e4e4e7;padding:6px 10px;font-size:16px;font-weight:600;color:#576980\">Method<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n    <\u002Fsc-if>\n\n    <div style=\"background:#fff;outline:1px solid #e4e4e7;outline-offset:-1px;padding:{{ cardPad }}\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n        <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#646363\">Executive summary<\u002Fdiv>\n        <div style=\"position:relative\">\n          <div role=\"button\" tabindex=\"0\" aria-haspopup=\"menu\" sc-camel-on-click=\"{{ toggleDl }}\" style=\"display:inline-flex;cursor:pointer;align-items:center;gap:8px;border:1px solid #e4e4e7;background:#fff;padding:7px 12px;font-size:16px;font-weight:700;line-height:20px;color:#0F294A\" style-hover=\"border-color:#c7c7ff;background:#f5f5ff\">Download <span style=\"font-size:16px;color:#646363\">▼<\u002Fspan><\u002Fdiv>\n          <sc-if value=\"{{ dlOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;top:calc(100% + 4px);right:0;z-index:20;min-width:170px;border:1px solid #e4e4e7;background:#fff;box-shadow:0 6px 18px rgba(15,41,74,.12)\">\n              <div role=\"menuitem\" tabindex=\"0\" sc-camel-on-click=\"{{ closeDl }}\" style=\"cursor:pointer;padding:9px 14px;font-size:19px;font-weight:600;color:#0F294A\" style-hover=\"background:#f5f5ff;color:#0000FF\">PDF<\u002Fdiv>\n              <div role=\"menuitem\" tabindex=\"0\" sc-camel-on-click=\"{{ closeDl }}\" style=\"cursor:pointer;border-top:1px solid #e4e4e7;padding:9px 14px;font-size:19px;font-weight:600;color:#0F294A\" style-hover=\"background:#f5f5ff;color:#0000FF\">Markdown<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h1 style=\"margin:6px 0 0;max-width:22em;font-family:'Archivo',sans-serif;font-size:36px;font-weight:800;line-height:40px;color:#0F294A;text-wrap:pretty\">{{ resultsTitle }}<\u002Fh1>\n\n      <section id=\"answer\" style=\"margin-top:24px;border-left:4px solid #0000FF;background:#f5f5ff;padding:20px 22px\">\n        <div style=\"font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#0000FF\">The answer<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-family:'Archivo',sans-serif;font-size:19px;font-weight:600;line-height:25px;color:#0F294A;text-wrap:pretty\">School-delivered diet and physical activity programmes show <b style=\"font-weight:800\">small reductions in BMI measures<\u002Fb>, while parent-focused digital approaches show no significant BMI improvement but some diet or activity gains.<\u002Fp>\n        <p style=\"margin:14px 0 0;font-size:19px;line-height:25px;color:#576980\"><b style=\"font-weight:800;color:#8a5a00\">Moderate confidence:<\u002Fb> several strong studies agree on what households buy, but only one UK study has measured an effect on children's weight.<\u002Fp>\n      <\u002Fsection>\n\n      <div style=\"margin-top:16px;display:flex;flex-wrap:wrap;gap:12px 24px\">\n        <div>\n          <div style=\"font-size:16px;color:#646363\">Last updated<\u002Fdiv>\n          <div style=\"margin-top:2px;font-size:19px;font-weight:700;color:#0F294A\">9 Sep 2026<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;color:#646363\">Authors<\u002Fdiv>\n          <div style=\"margin-top:2px;font-size:19px;font-weight:700;color:#0F294A\">Rosie Oxbury, Shabeer Rauf, Karlis Kander<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;color:#646363\">Sources<\u002Fdiv>\n          <div style=\"margin-top:2px;font-size:19px;font-weight:700;color:#0F294A\">{{ countFound }} found · <span style=\"color:#0000FF\">{{ countCited }} cited<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:16px;color:#646363\">Published<\u002Fdiv>\n          <div style=\"margin-top:2px;font-size:19px;font-weight:700;color:#0F294A\">2016–2026<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n\n      <section style=\"margin-top:34px\">\n        <h2 id=\"key-findings\" style=\"margin:0 0 14px;font-family:'Archivo',sans-serif;font-size:24px;font-weight:800;color:#0F294A\">Key findings<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ keyFindings }}\" as=\"k\" hint-placeholder-count=\"5\">\n            <div style=\"display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start\">\n              <span style=\"margin-top:8px;height:7px;width:7px;background:{{ k.bullet }}\"><\u002Fspan>\n              <p style=\"margin:0;font-size:19px;line-height:25px;color:#1c1c1e;text-wrap:pretty\"><b style=\"font-weight:800;color:{{ k.leadColour }}\">{{ k.lead }}<\u002Fb> {{ k.body }} <sc-if value=\"{{ k.hasCite }}\" hint-placeholder-val=\"{{ true }}\"><span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ k.open }}\" title=\"{{ k.tip }}\" style=\"display:inline-flex;align-items:center;cursor:pointer;border:1px solid #c7c7ff;background:#ececff;padding:0 7px;font-size:16px;font-weight:700;color:#0000FF;vertical-align:1px\">{{ k.chip }}<\u002Fspan><\u002Fsc-if><\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"margin-top:30px;border-top:1px solid #e4e4e7;padding-top:26px\">\n        <h3 id=\"country-highlights\" style=\"margin:0 0 14px;font-family:'Archivo',sans-serif;font-size:19px;font-weight:800;line-height:25px;color:#0F294A\">Case studies<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ countries }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"border
